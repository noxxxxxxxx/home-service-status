name: Check and publish service status

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "check.py"
      - "public/index.html"
      - "public/style.css"
      - "public/app.js"
      - ".github/workflows/status.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: service-status-pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public services
        run: python3 check.py
      - name: Save bounded history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/status.json public/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update service status [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
